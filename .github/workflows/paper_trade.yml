name: Paper trade

# Logs the strategy board's picks at live Kalshi prices and settles old ones.
# Public market data only: no secrets needed.
#
# GitHub skips short cron schedules on quiet repos, so each run stays alive
# for ~5h45m and scans every 10 minutes; a new run is scheduled every 4 hours
# and queues behind the current one, which keeps coverage continuous.
on:
  schedule:
    - cron: "7 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: paper-trade
  cancel-in-progress: false

jobs:
  paper-trade:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scan and settle every 10 minutes
        run: |
          git config user.name "hedj-paper-bot"
          git config user.email "hedj-paper-bot@users.noreply.github.com"
          end=$(( $(date +%s) + 345 * 60 ))
          while [ "$(date +%s)" -lt "$end" ]; do
            # This bot is the only writer of picks.csv. A queued run checks out the
            # commit from when it was scheduled, so start every round from the
            # latest push or the first commit conflicts and wedges the run
            git fetch -q origin main && git reset -q --hard origin/main
            # A hung API call must not stall the whole run
            timeout 480 python scripts/paper_trader.py || echo "scan failed or timed out, retrying next round"
            [ -f paper/parlays.csv ] && { timeout 120 python scripts/parlay_builder.py --settle || echo "parlay settle failed"; }
            git add paper/picks.csv paper/parlays.csv 2>/dev/null || git add paper/picks.csv
            if ! git diff --cached --quiet; then
              git commit -q -m "Paper trade: update picks [skip ci]"
              git push -q origin HEAD:main || echo "push failed, will retry next round"
            fi
            sleep 540
          done
