name: Update Odds Feed

on:
  schedule:
    # 6 sports × 3 markets = 18 credits/run
    # Peak (12pm-12am ET = 17-05 UTC): every 30 min = 24 runs/day
    # Off-peak (12am-12pm ET = 5-17 UTC): every 2 hours = 6 runs/day
    # Total: 30 runs/day × 18 credits = 540/day = 16,200/month (under 20k)
    #
    # Peak: every 30 min during game hours
    - cron: "0,30 17-23 * * *"    # 12pm-7:30pm ET
    - cron: "0,30 0-4 * * *"      # 7pm-12:30am ET
    # Off-peak: every 2 hours
    - cron: "0 5,7,9,11,13,15 * * *"  # 12am-12pm ET
  workflow_dispatch:
    # Allow manual triggers

permissions:
  contents: write

concurrency:
  group: odds-feed
  cancel-in-progress: true

jobs:
  update-feed:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create config from template
        run: |
          cp config.example.json config.json
          if [ -n "${{ secrets.ODDS_API_KEY }}" ]; then
            sed -i 's/"api_key": "YOUR_API_KEY"/"api_key": "${{ secrets.ODDS_API_KEY }}"/' config.json
          fi

      - name: Run odds feed update
        run: python -m hedj.cli --config config.json

      - name: Check for arbitrage opportunities
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python scripts/arb_alerts.py

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add data/history/odds_history.csv data/latest/latest.csv

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update odds feed - $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            # Pull and rebase to handle concurrent updates
            git pull --rebase origin main || true
            git push
          fi
